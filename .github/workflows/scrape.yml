name: Scrape Farfetch

on:
  schedule:
    # Tuesday, Thursday, Sunday at 8:00 UTC
    - cron: '0 8 * * 0,2,4'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python main.py

      - name: Upload failed products log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-products-log
          path: logs/failed_products.log
          if-no-files-found: ignore
          retention-days: 30
